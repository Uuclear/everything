name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    name: Server test & cross-compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - name: Build embedded web assets
        working-directory: web
        run: npm ci --no-audit --no-fund && npm run build
      - name: Test
        working-directory: server
        run: CGO_ENABLED=0 go test ./...
      - name: Vet
        working-directory: server
        run: go vet ./...
      - name: Cross compile
        working-directory: server
        run: |
          for target in linux/amd64 linux/arm64 darwin/arm64 windows/amd64; do
            GOOS=${target%/*} GOARCH=${target#*/} CGO_ENABLED=0 go build ./cmd/eve
          done

  web:
    name: Web build (embed)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: web
      - name: Build
        working-directory: web
        run: npm run build
      - name: Verify Go embeds built web
        working-directory: server
        run: CGO_ENABLED=0 go build -o /tmp/eve ./cmd/eve

  android:
    name: Android assembleDebug
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
      - name: Build debug APK
        working-directory: android
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: everything-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  docker:
    name: Docker multi-arch build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build (amd64+arm64, no push)
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            -f deploy/Dockerfile .
