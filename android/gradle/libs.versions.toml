[versions]
agp = "8.7.3"
kotlin = "2.1.0"
ksp = "2.1.0-1.0.29"
coreKtx = "1.15.0"
appcompat = "1.7.0"
activityCompose = "1.9.3"
lifecycle = "2.8.7"
navigationCompose = "2.8.5"
composeBom = "2024.12.01"
room = "2.6.1"
work = "2.10.0"
retrofit = "2.11.0"
moshi = "1.15.1"
okhttp = "4.12.0"
securityCrypto = "1.1.0-alpha06"
coroutines = "1.9.0"
lazysodium = "5.1.0"
jna = "5.14.0"
junit = "4.13.2"
androidxTestExtJunit = "1.2.1"
androidxTestCore = "1.6.1"
json = "20240303"
coroutinesTest = "1.9.0"
# B8：CameraX 相机预览/取帧、ML Kit 端侧文字识别、Robolectric 本地单测
camerax = "1.4.2"
mlkitTextRecognition = "16.0.1"
robolectric = "4.14.1"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigationCompose" }
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
androidx-ui = { module = "androidx.compose.ui:ui" }
androidx-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
androidx-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
androidx-material3 = { module = "androidx.compose.material3:material3" }

androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
androidx-room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
androidx-work-runtime = { module = "androidx.work:work-runtime-ktx", version.ref = "work" }
androidx-security-crypto = { module = "androidx.security:security-crypto", version.ref = "securityCrypto" }

kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
retrofit = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofit" }
retrofit-converter-moshi = { module = "com.squareup.retrofit2:converter-moshi", version.ref = "retrofit" }
moshi-kotlin = { module = "com.squareup.moshi:moshi-kotlin", version.ref = "moshi" }
okhttp-logging = { module = "com.squareup.okhttp3:logging-interceptor", version.ref = "okhttp" }

lazysodium = { module = "com.goterl:lazysodium-android", version.ref = "lazysodium" }
# JVM 变体：桌面原生库随 jar 自带，仅供 JVM 单测生成跨端锚点密文（阶段 4a Task 5）
lazysodium-java = { module = "com.goterl:lazysodium-java", version.ref = "lazysodium" }
jna = { module = "net.java.dev.jna:jna", version.ref = "jna" }
junit = { module = "junit:junit", version.ref = "junit" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestExtJunit" }
androidx-test-core = { module = "androidx.test:core", version.ref = "androidxTestCore" }
androidx-room-testing = { module = "androidx.room:room-testing", version.ref = "room" }
# 真实 org.json 实现：JVM 单测下 android.jar stub 的 JSONObject.put 默认抛
# RuntimeException("Method ... not mocked")——returnDefaultValues 让 put 返回 null 导致
# 链式 JSONObject().put().put() 抛 NPE。这里用真实 json 库覆盖 stub，确保 AttachmentRepository
# 测试能正常序列化 records 通道元数据 JSON。
json = { module = "org.json:json", version.ref = "json" }
# 协程测试：Dispatchers.setMain(UnconfinedTestDispatcher()) 让 viewModelScope.launch
# 在 JVM 单测（无 Android main looper）下可立即执行（B3 附件 VM 测试必需）
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutinesTest" }

# ===== B8：相机预览/取帧（CameraX 四件套） =====
camerax-core = { module = "androidx.camera:camera-core", version.ref = "camerax" }
camerax-camera2 = { module = "androidx.camera:camera-camera2", version.ref = "camerax" }
camerax-lifecycle = { module = "androidx.camera:camera-lifecycle", version.ref = "camerax" }
camerax-view = { module = "androidx.camera:camera-view", version.ref = "camerax" }
# ML Kit 文字识别（自包含 AAR：模型随包下发、全程 on-device、无 GMS 云依赖）
mlkit-text-recognition = { module = "com.google.mlkit:text-recognition", version.ref = "mlkitTextRecognition" }
# ML Kit 中文文字识别模型构件：text-recognition 16.0.1 仅为 Latin 门面薄壳，
# ChineseTextRecognizerOptions 位于本独立构件（同为 16.0.1，全程端侧、无云依赖）
mlkit-text-recognition-chinese = { module = "com.google.mlkit:text-recognition-chinese", version.ref = "mlkitTextRecognition" }
# Robolectric：JVM 内模拟 Android 运行环境（B8 Compose Sheet 本地单测）
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
